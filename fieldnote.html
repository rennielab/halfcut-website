  const POSTS = {
    'bridge-not-saviour': {
      title: "The bridge, not the saviour: what we learned when we stopped writing ourselves into the middle of the story.",
      category: 'Manifesto',
      author: 'James Stanton-Cooke',
      authorRole: 'Co-founder & CEO',
      authorAvatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80',
      readTime: '14 min read',
      date: 'April 2026',
      hero: 'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2400&q=80',
      lede: "For twelve years HalfCut talked about saving the rainforest. In the last eighteen months we've quietly stopped, and the work has gotten better for it. This is the account of what changed, why, and what it took to make the change stick.",
      body: `
        <p>The first thing to say is that we were not lying. When HalfCut wrote, for most of its first decade, about &ldquo;saving the Daintree&rdquo;, the people who wrote those words believed them, and many of the people who donated against them believed them too. Belief is not the problem. The problem is the shape of the sentence.</p>
        <p>&ldquo;HalfCut saves the Daintree&rdquo; puts a verb in HalfCut's hands and an object on the receiving end. It makes the rainforest into something acted upon, and the organisation into the actor. It makes the Eastern Kuku Yalanji Bama people, who have been the actor on this Country for sixty thousand years, invisible by grammar.</p>
        <h2>What we changed</h2>
        <p>We stopped writing ourselves as the verb. We started writing in the voice of the bridge. HalfCut funds. HalfCut holds the governance. HalfCut publishes the audit. The acting verbs, restoring, healing, deciding, returning, all belong to the people on Country. We do not own them.</p>
        <blockquote>
          The forest my grandfather walked is not the forest I walk. The forest my grandchildren walk will be the one we make now.
          <cite>Lee Yeatman · Chairperson, Jabalbina Yalanji Aboriginal Corporation</cite>
        </blockquote>
        <h2>Why it matters</h2>
        <p>Charities are sentence-builders. The way we talk about the work shapes who gets to do it, who gets credited for it, and who gets the next dollar. When the saviour sits at the centre of the page, the people doing the actual saving are pushed to the margin, photographed for fundraising, and forgotten when the cheques clear.</p>
        <p>This isn't a stylistic preference. It is a financial mechanism. The funding industry has been built on saviour sentences for fifty years, and the result is that First Nations conservation organisations remain chronically under-resourced while the international charities that talk about them grow.</p>
        <h2>What it cost</h2>
        <p>The rewrite cost about a third of our donor list in year one. Some people who had given for years stopped giving. They wrote back: &ldquo;I don't see the impact anymore.&rdquo; What they meant was: I don't see myself in the impact anymore. The impact is now attributed to the people doing the work, not the donors who pay for it, and that breaks a contract people thought they had.</p>
        <p>That contract was always wrong. It just took us a long time to write our way out of it.</p>
        <h2>What we'd do differently</h2>
        <p>We would have done it sooner, and we would not have apologised for it. The longer a charity holds the saviour sentence, the harder it becomes to give up, because every grant application, donor pitch and impact report is built on the same grammar. Pulling the thread late means unpicking the whole jumper.</p>
        <p>Twelve years in, we've rewritten how we talk about the work. The work is better for it. So is the relationship. So, we think, is the giving.</p>
      `
    },
    'three-seasons': {
      title: "Three seasons on Jabalbina Country: what the ranger program is doing, in plain language.",
      category: 'Field dispatch',
      author: 'Field team',
      authorRole: 'HalfCut · with the Eastern Kuku Yalanji ranger program',
      authorAvatar: 'https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&w=200&q=80',
      readTime: '6 min read',
      date: 'March 2026',
      hero: 'https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&w=2400&q=80',
      lede: "An on-Country dispatch from three visits across the Wet, the Dry, and the Knock-em-down. What the ranger team is doing right now, what's working, what's hard, and what the next season looks like.",
      body: `
        <p>The Wet started early this year. By mid-November the access road into one of the restoration sites was knee-deep in clay and the rangers were planning around it, not against it. The work doesn't stop for the Wet. It just changes shape.</p>
        <h2>Wet season: seed</h2>
        <p>This is when the ranger team does the slow, careful work of seed collection. Native species, hand-collected from intact patches of forest, sorted, dried, catalogued. The work that pays off in the next planting cycle, but doesn't photograph well.</p>
        <h2>Dry season: plant</h2>
        <p>By July the planting begins. This year the team planted more than 12,000 seedlings across two priority parcels. Native fig, blue quandong, milky pine, Hopkins's penda. The species chosen by the Bama, for the cassowary, for the ground.</p>
        <h2>Knock-em-down: care</h2>
        <p>The transitional months between Dry and Wet are when seedling care happens. Tending, weeding, replacing. Every Tuesday morning, the same team, the same loop, the same patient repetition. The work that turns a planted seedling into a tree.</p>
        <p>None of this is glamorous. All of it is essential.</p>
      `
    },

      authorAvatar: 'https://images.unsplash.com/photo-1574482620811-1aa16ffe3c82?auto=format&fit=crop&w=200&q=80',
      readTime: '9 min read',
      date: 'February 2026',
      hero: 'https://images.unsplash.com/photo-1574482620811-1aa16ffe3c82?auto=format&fit=crop&w=2400&q=80',
      lede: "A long-form conversation on time, custodianship, and what it means to inherit Country. Recorded over two afternoons. Shared with permission.",
      body: `

    'q1-ledger': {
      title: "Every dollar, published: reading the Q1 ledger.",
      category: 'On the money',
      author: 'Nicole Canale',
      authorRole: 'Director & Treasurer',
      authorAvatar: 'https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=200&q=80',
      readTime: '4 min read',
      date: 'February 2026',
      hero: 'https://images.unsplash.com/photo-1579091106567-95fda0d90c90?auto=format&fit=crop&w=2400&q=80',
      lede: "A plain-language read-out of the Q1 figures, in the same order they're recorded in the books. No story arc. Just the numbers, and what they mean.",
      body: `
        <p>This Field Note is published quarterly. It is not a marketing piece. It is the working ledger, in narrative form, so anyone who wants to understand where the money goes can read it without an accounting background.</p>
        <h2>What came in</h2>
        <p>Donations, campaign revenue, partnership contributions, and grants. Reconciled monthly. Every line item is in the official quarterly statement filed with the ACNC.</p>
        <h2>Where it went</h2>
        <p>One hundred per cent of profits to Country, via Jabalbina Yalanji Aboriginal Corporation. The operational mechanic for that promise is 92¢ direct transfer, 5¢ program delivery, 3¢ operations.</p>
        <h2>What's left to do</h2>
        <p>Two items remain open at quarter-end. Detail in the full quarterly report.</p>
      `
    },

      title: "A summer of cassowary track counts.",
      category: 'Field note',
      author: 'Field team',
      authorRole: 'Wet Tropics survey',
      authorAvatar: 'https://images.unsplash.com/photo-1710812030602-4a3662eb0135?auto=format&fit=crop&w=200&q=80',
      readTime: '5 min read',
      date: 'January 2026',
      hero: 'https://images.unsplash.com/photo-1710812030602-4a3662eb0135?auto=format&fit=crop&w=2400&q=80',
      lede: "What thirty-eight cassowary track sightings in one summer tell us about a forest that's quietly rebuilding itself.",
      body: `
        <p>Cassowaries are nature's gardeners. A single bird disperses the seeds of more than 150 rainforest fruits across a home range of forty kilometres. When the cassowary moves through, the seeds move with it. When the cassowary disappears, so does the forest's ability to plant itself.</p>
        <h2>What the summer showed</h2>
        <p>Across the restoration parcels we surveyed in November to February, the ranger team logged thirty-eight distinct track-and-droppings sightings. That is more than the previous two summers combined.</p>
        <h2>What it means</h2>
        <p>One summer doesn't make a trend. Three summers in a row would. We will know more after the next two surveys.</p>
      `
    }
